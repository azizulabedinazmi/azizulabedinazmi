<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F2B705"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#1E293B"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1280" height="640" fill="#0B1120"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#dotgrid)" opacity="0.5"/>

  <!-- terminal window -->
  <g transform="translate(120,140)">
    <rect x="0" y="0" width="1040" height="360" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>

    <!-- title bar -->
    <rect x="0" y="0" width="1040" height="44" rx="14" fill="#111827"/>
    <rect x="0" y="30" width="1040" height="14" fill="#111827"/>
    <circle cx="28" cy="22" r="6.5" fill="#F87171"/>
    <circle cx="50" cy="22" r="6.5" fill="#FBBF24"/>
    <circle cx="72" cy="22" r="6.5" fill="#34D399"/>
    <text x="520" y="27" font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', monospace" font-size="14" fill="#64748B" text-anchor="middle">~/azizulabedinazmi</text>

    <!-- prompt line 1 -->
    <text x="40" y="100" font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', monospace" font-size="22" fill="#38BDF8">$ Whoami</text>

    <!-- name output -->
    <text x="40" y="165" font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', monospace" font-size="46" font-weight="700" fill="#E5E7EB">Azizul Abedin Azmi<tspan fill="#F2B705">▍</tspan></text>

    <!-- tagline -->
    <text x="40" y="215" font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', monospace" font-size="17" fill="#94A3B8">AI/ML Researcher · Computer Vision · Computer Science &amp; Engineering - 🎓 East West University</text>

    <!-- second prompt -->
    <text x="40" y="270" font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', monospace" font-size="20" fill="#38BDF8">$ Status</text>
    <text x="40" y="305" font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', monospace" font-size="19" fill="#E5E7EB">Still building, Still learning, Still going<tspan fill="#F2B705">.</tspan></text>
  </g>

  <!-- bottom accent divider -->
  <rect x="0" y="628" width="1280" height="6" fill="url(#accentLine)"/>
</svg>
